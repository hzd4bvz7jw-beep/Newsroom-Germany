<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming & Simracing News</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent-de: #3b82f6;
      --accent-sim: #ef4444;
      --accent-int: #a855f7;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; margin-bottom: 30px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .column {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title {
      font-size: 1.2rem;
      padding-bottom: 8px;
      margin-bottom: 15px;
      border-bottom: 3px solid;
    }
    .de { border-color: var(--accent-de); color: var(--accent-de); }
    .sim { border-color: var(--accent-sim); color: var(--accent-sim); }
    .int { border-color: var(--accent-int); color: var(--accent-int); }

    /* RSS Widget Design Anpassen */
    iframe {
      width: 100%;
      height: 700px;
      border: none;
      border-radius: 8px;
      background: var(--card-bg);
    }
  </style>
</head>
<body>

  <h1>🎮 Gaming & Simracing Dashboard</h1>

  <div class="grid">
    <!-- DEUTSCH GAMING -->
    <div class="column">
      <div class="title de">🇩🇪 Gaming (DACH)</div>
      <iframe src="https://www.rssfeedwidget.com/widget/index/html/feed_url=https%3A%2F%2Fwww.gamestar.de%2Fnews%2Frss%2Fnews.rss/show_title=0/show_desc=1/desc_len=120/max_items=8/bg_color=1e293b/text_color=f8fafc/link_color=3b82f6/"></iframe>
    </div>

    <!-- SIMRACING DEUTSCH -->
    <div class="column">
      <div class="title sim">🏎️ Simracing (DE)</div>
      <iframe src="https://www.rssfeedwidget.com/widget/index/html/feed_url=https%3A%2F%2Fnews.google.com%2Frss%2Fsearch%3Fq%3DSimracing%2BOR%2BiRacing%2BOR%2B%2522Assetto%2BCorsa%2522%26hl%3Dde%26gl%3DDE%26ceid%3DDE%3Ade/show_title=0/show_desc=1/desc_len=120/max_items=8/bg_color=1e293b/text_color=f8fafc/link_color=ef4444/"></iframe>
    </div>

    <!-- INTERNATIONAL GAMING -->
    <div class="column">
      <div class="title int">🌐 Gaming (International)</div>
      <iframe src="https://www.rssfeedwidget.com/widget/index/html/feed_url=https%3A%2F%2Fwww.eurogamer.net%2Ffeed%2Fnews/show_title=0/show_desc=1/desc_len=120/max_items=8/bg_color=1e293b/text_color=f8fafc/link_color=a855f7/"></iframe>
    </div>
  </div>

</body>
</html>
