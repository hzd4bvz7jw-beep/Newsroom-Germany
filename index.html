<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming & Simracing News Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-de: #3b82f6;
      --accent-sim: #ef4444;
      --accent-int: #a855f7;
      --muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .column {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .column-title {
      font-size: 1.25rem;
      padding-bottom: 10px;
      margin-bottom: 15px;
      border-bottom: 3px solid;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .de-head { border-color: var(--accent-de); color: var(--accent-de); }
    .sim-head { border-color: var(--accent-sim); color: var(--accent-sim); }
    .int-head { border-color: var(--accent-int); color: var(--accent-int); }

    .news-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      transition: transform 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    .news-card:hover {
      transform: translateY(-2px);
    }

    .news-card h3 {
      margin: 0 0 8px 0;
      font-size: 1rem;
      line-height: 1.3;
    }

    .news-card h3 a {
      color: var(--text-color);
      text-decoration: none;
    }

    .news-card h3 a:hover {
      text-decoration: underline;
    }

    .news-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .news-summary {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .loading {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>🎮 Gaming & Simracing Live Dashboard</h1>

  <div class="grid">
    <!-- DEUTSCH GAMING -->
    <div class="column">
      <div class="column-title de-head">
        <span>🇩🇪 Gaming (DACH)</span>
      </div>
      <div id="feed-de" class="loading">Lade deutsche Gaming-News...</div>
    </div>

    <!-- SIMRACING DEUTSCH -->
    <div class="column">
      <div class="column-title sim-head">
        <span>🏎️ Simracing & Motorsport (DE)</span>
      </div>
      <div id="feed-sim" class="loading">Lade deutsche Simracing-News...</div>
    </div>

    <!-- INTERNATIONAL GAMING -->
    <div class="column">
      <div class="column-title int-head">
        <span>🌐 Gaming (International)</span>
      </div>
      <div id="feed-int" class="loading">Lade internationale News...</div>
    </div>
  </div>

  <script>
    // RSS Feed Quellen definieren
    const FEEDS = {
      de: [
        'https://www.gamestar.de/news/rss/news.rss',
        'https://www.computerbase.de/rss/news.xml',
        'https://www.pcgameshardware.de/feed.cfm'
      ],
      sim: [
        'https://www.motorsport-magazin.com/rss/editorial.xml',
        'https://www.kicker.de/news/aktuell/rss'
      ],
      int: [
        'https://feeds.feedburner.com/ign/all',
        'https://www.eurogamer.net/feed/news'
      ]
    };

    // Hilfsfunktion zum Bereinigen von HTML-Tags in der Zusammenfassung
    function stripHtml(html) {
      if (!html) return "";
      let tmp = document.createElement("DIV");
      tmp.innerHTML = html;
      let text = tmp.textContent || tmp.innerText || "";
      return text.length > 150 ? text.substring(0, 150) + "..." : text;
    }

    // Robuste Fetch-Funktion mit Fallback-Proxies
    async function fetchFeed(url) {
      // 1. Versuch: rss2json API
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (data.status === 'ok' && data.items && data.items.length > 0) {
          const sourceName = data.feed.title ? data.feed.title.replace(" Feed", "").replace(" RSS", "") : "News";
          return data.items.map(item => ({ ...item, source: sourceName }));
        }
      } catch (e) {
        console.warn("rss2json fehlgeschlagen für:", url);
      }

      // 2. Versuch (Fallback): AllOrigins Proxy (falls CORS blockiert)
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (data.contents) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(data.contents, "text/xml");
          const items = Array.from(xmlDoc.querySelectorAll("item")).map(item => {
            const title = item.querySelector("title")?.textContent || "";
            const link = item.querySelector("link")?.textContent || "";
            const pubDate = item.querySelector("pubDate")?.textContent || "";
            const description = item.querySelector("description")?.textContent || "";
            return {
              title,
              link,
              pubDate,
              description,
              source: new URL(url).hostname.replace("www.", "")
            };
          });
          return items;
        }
      } catch (e) {
        console.error("Alle Versuche fehlgeschlagen für:", url);
      }

      return [];
    }

    // Spalte befüllen
    async function loadCategory(categoryKey, containerId) {
      const container = document.getElementById(containerId);
      let allItems = [];

      const fetchPromises = FEEDS[categoryKey].map(url => fetchFeed(url));
      const results = await Promise.all(fetchPromises);
      
      results.forEach(items => {
        allItems = allItems.concat(items);
      });

      // Nach Datum sortieren (neueste zuerst)
      allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

      // Top 12 Artikel anzeigen
      const topItems = allItems.slice(0, 12);

      if (topItems.length === 0) {
        container.innerHTML = "<div style='color: #ef4444;'>Keine News geladen. Feeds temporär nicht erreichbar.</div>";
        return;
      }

      container.innerHTML = topItems.map(item => `
        <div class="news-card">
          <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
          <div class="news-meta">
            <span>📅 ${isNaN(new Date(item.pubDate)) ? '' : new Date(item.pubDate).toLocaleDateString([], {day: '2-digit', month: '2-digit'}) + ' ' + new Date(item.pubDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' Uhr'}</span>
            <span>📌 ${item.source || 'News'}</span>
          </div>
          <div class="news-summary">${stripHtml(item.description || item.content)}</div>
        </div>
      `).join('');
    }

    // Initiales Laden starten
    loadCategory('de', 'feed-de');
    loadCategory('sim', 'feed-sim');
    loadCategory('int', 'feed-int');

    // Automatische Aktualisierung alle 30 Minuten
    setInterval(() => {
      loadCategory('de', 'feed-de');
      loadCategory('sim', 'feed-sim');
      loadCategory('int', 'feed-int');
    }, 30 * 60 * 1000);
  </script>
</body>
</html>
