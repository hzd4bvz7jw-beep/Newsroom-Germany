<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming & Simracing News Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-de: #3b82f6;
      --accent-int: #a855f7;
      --accent-sim: #ef4444;
      --muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .column {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .column-title {
      font-size: 1.25rem;
      font-weight: 700;
      padding-bottom: 12px;
      margin-bottom: 20px;
      border-bottom: 3px solid;
    }

    .de-head { border-color: var(--accent-de); color: var(--accent-de); }
    .int-head { border-color: var(--accent-int); color: var(--accent-int); }
    .sim-head { border-color: var(--accent-sim); color: var(--accent-sim); }

    .news-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .news-card h3 {
      margin: 0 0 12px 0;
      font-size: 1.05rem;
      line-height: 1.4;
    }

    .news-card h3 a {
      color: var(--text-color);
      text-decoration: none;
    }

    .news-card h3 a:hover {
      text-decoration: underline;
    }

    /* Entzerrter Meta-Bereich für Datum & Quelle */
    .news-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      margin-bottom: 12px;
    }

    .news-date {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .news-source {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .news-summary {
      font-size: 0.875rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .loading {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>🎮 Gaming & Simracing Live Dashboard</h1>

  <div class="grid">
    <div class="column">
      <div class="column-title de-head">🇩🇪 DACH Gaming</div>
      <div id="feed-de" class="loading">Lade News...</div>
    </div>

    <div class="column">
      <div class="column-title int-head">🌐 International</div>
      <div id="feed-int" class="loading">Lade News...</div>
    </div>

    <div class="column">
      <div class="column-title sim-head">🏎️ Simracing & Esports</div>
      <div id="feed-sim" class="loading">Lade News...</div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const res = await fetch(`./news.json?cachebust=${Date.now()}`);
        if (!res.ok) throw new Error("news.json noch nicht bereit");
        
        const data = await res.json();

        ['de', 'int', 'sim'].forEach(cat => {
          const container = document.getElementById(`feed-${cat}`);
          const items = data[cat] || [];

          if (items.length === 0) {
            container.innerHTML = "Keine News verfügbar.";
            return;
          }

          container.innerHTML = items.map(item => `
            <div class="news-card">
              <h3><a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a></h3>
              <div class="news-meta">
                <span class="news-date">📅 ${item.pubDate || 'Neu'}</span>
                <span class="news-source">📌 ${item.source}</span>
              </div>
              <div class="news-summary">${item.summary}</div>
            </div>
          `).join('');
        });
      } catch (err) {
        console.error(err);
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 5 * 60 * 1000);
  </script>
</body>
</html>
