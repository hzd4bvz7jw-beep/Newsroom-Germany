<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming & Simracing News Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-de: #3b82f6;
      --accent-int: #a855f7;
      --accent-sim: #ef4444;
      --muted: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .column {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .column-title {
      font-size: 1.25rem;
      padding-bottom: 10px;
      margin-bottom: 15px;
      border-bottom: 3px solid;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .de-head { border-color: var(--accent-de); color: var(--accent-de); }
    .int-head { border-color: var(--accent-int); color: var(--accent-int); }
    .sim-head { border-color: var(--accent-sim); color: var(--accent-sim); }

    .news-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      transition: transform 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    .news-card:hover { transform: translateY(-2px); }

    .news-card h3 { margin: 0 0 8px 0; font-size: 1rem; line-height: 1.3; }
    .news-card h3 a { color: var(--text-color); text-decoration: none; }
    .news-card h3 a:hover { text-decoration: underline; }

    .news-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .news-summary { font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; }
    .loading { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>

  <h1>🎮 Gaming & Simracing Live Dashboard</h1>

  <div class="grid">
    <div class="column">
      <div class="column-title de-head"><span>🇩🇪 DACH Gaming</span></div>
      <div id="feed-de" class="loading">Lade News...</div>
    </div>

    <div class="column">
      <div class="column-title int-head"><span>🌐 International</span></div>
      <div id="feed-int" class="loading">Lade News...</div>
    </div>

    <div class="column">
      <div class="column-title sim-head"><span>🏎️ Simracing & Esports</span></div>
      <div id="feed-sim" class="loading">Lade News...</div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        // Lädt die auf GitHub erstellte statische Datei (kein Proxy nötig!)
        const res = await fetch(`./news.json?cachebust=${Date.now()}`);
        if (!res.ok) throw new Error("news.json noch nicht erstellt");
        
        const data = await res.json();

        ['de', 'int', 'sim'].forEach(cat => {
          const container = document.getElementById(`feed-${cat}`);
          const items = data[cat] || [];

          if (items.length === 0) {
            container.innerHTML = "Keine News verfügbar.";
            return;
          }

          container.innerHTML = items.map(item => `
            <div class="news-card">
              <h3><a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a></h3>
              <div class="news-meta">
                <span>📌 ${item.source}</span>
              </div>
              <div class="news-summary">${item.summary}</div>
            </div>
          `).join('');
        });
      } catch (err) {
        console.error(err);
        document.getElementById('feed-de').innerHTML = "Warte auf die erste Generierung der News...";
        document.getElementById('feed-int').innerHTML = "Warte auf die erste Generierung der News...";
        document.getElementById('feed-sim').innerHTML = "Warte auf die erste Generierung der News...";
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 5 * 60 * 1000); // Alle 5 Min neu prüfen
  </script>
</body>
</html>
